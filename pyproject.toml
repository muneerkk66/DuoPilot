[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duopilot"
version = "0.1.0"
description = "OpenAI-powered agent for migrating and validating iOS projects for iPhone Duo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[project.scripts]
duopilot = "duopilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/duopilot"]
